[project]
name = "stock-mkt-app"
version = "0.1.0"
description = "Stock Portfolio Analyzer (Streamlit + yfinance)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
